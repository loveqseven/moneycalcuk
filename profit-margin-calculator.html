<!doctype html><html lang="en-GB"><head><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2310374741315855"
     crossorigin="anonymous"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profit Margin Calculator | MoneyCalcUK</title><meta name="description" content="Calculate profit, profit margin and markup from your costs and selling price."><link rel="stylesheet" href="styles.css"><style>.tool{max-width:700px;margin:50px auto;background:#fff;border:1px solid #e4e9f1;border-radius:18px;padding:30px}label{font-weight:700;display:block;margin:15px 0}input{width:100%;padding:12px;margin-top:7px;border:1px solid #cbd5e1;border-radius:9px;font-size:1rem}.calc{background:#1769e0;color:white;border:0;padding:13px 20px;border-radius:9px;font-weight:800}.result{display:none;background:#f1f7ff;border-radius:14px;padding:20px;margin-top:20px}.result.show{display:block}</style></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html">MoneyCalc<span>UK</span></a><nav><a href="index.html#calculators">Calculators</a></nav></div></header><main class="container"><div class="tool"><p class="eyebrow">BUSINESS</p><h1>Profit Margin Calculator</h1><label>Cost (£)<input id="cost" type="number" value="20" min="0" step=".01"></label><label>Selling price (£)<input id="sell" type="number" value="40" min="0" step=".01"></label><button class="calc" onclick="calcProfit()">Calculate</button><div id="result" class="result"></div></div></main><script src="calculator.js"></script><script>function calcProfit(){const c=Math.max(0,Number(cost.value)||0),s=Math.max(0,Number(sell.value)||0),p=s-c,margin=s?p/s*100:0,markup=c?p/c*100:0;setResult('result',`Profit: <strong>${money(p)}</strong><br>Profit margin: <strong>${margin.toFixed(2)}%</strong><br>Markup: <strong>${markup.toFixed(2)}%</strong>`)}</script></body></html>
