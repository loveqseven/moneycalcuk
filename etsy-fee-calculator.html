<!doctype html><html lang="en-GB"><head><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2310374741315855"
     crossorigin="anonymous"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Etsy Fee Calculator UK | MoneyCalcUK</title><meta name="description" content="Starter Etsy seller fee calculator page for UK sellers."><link rel="stylesheet" href="styles.css"><style>.tool{max-width:700px;margin:50px auto;background:#fff;border:1px solid #e4e9f1;border-radius:18px;padding:30px}input{width:100%;padding:12px;margin:8px 0 16px;border:1px solid #cbd5e1;border-radius:9px}.calc{background:#1769e0;color:#fff;border:0;padding:13px 20px;border-radius:9px;font-weight:800}.result{display:none;background:#f1f7ff;padding:20px;border-radius:14px;margin-top:20px}.result.show{display:block}</style></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html">MoneyCalc<span>UK</span></a><nav><a href="index.html#calculators">Calculators</a></nav></div></header><main class="container"><div class="tool"><p class="eyebrow">ONLINE SELLING</p><h1>Etsy Fee Calculator UK</h1><p style="color:#64748b">Model a percentage-based fee. Add current Etsy listing, transaction, payment-processing and other applicable fees for a more complete model.</p><label>Order value (£)<input id="price" type="number" value="30" min="0"></label><label>Fee percentage (%)<input id="fee" type="number" value="6.5" min="0" step=".1"></label><button class="calc" onclick="calcFee()">Calculate</button><div id="result" class="result"></div></div></main><script>function calcFee(){const p=Number(price.value)||0,f=Number(fee.value)||0,x=p*f/100;document.getElementById('result').innerHTML=`Estimated fee: <strong>£${x.toFixed(2)}</strong><br>Amount left before other costs: <strong>£${(p-x).toFixed(2)}</strong>`;document.getElementById('result').classList.add('show')}</script></body></html>
