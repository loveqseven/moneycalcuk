<!doctype html><html lang="en-GB"><head><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2310374741315855"
     crossorigin="anonymous"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UK Mortgage Calculator | MoneyCalcUK</title><meta name="description" content="Free UK mortgage repayment calculator. Estimate monthly payments and total interest."><link rel="stylesheet" href="styles.css"><style>.tool{max-width:760px;margin:50px auto;background:#fff;border:1px solid #e4e9f1;border-radius:18px;padding:30px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{font-weight:700}input{width:100%;padding:12px;margin-top:7px;border:1px solid #cbd5e1;border-radius:9px;font-size:1rem}.calc{margin-top:20px;background:#1769e0;color:white;border:0;padding:13px 20px;border-radius:9px;font-weight:800}.result{display:none;background:#f1f7ff;border-radius:14px;padding:20px;margin-top:20px}.result.show{display:block}@media(max-width:600px){.form-grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html">MoneyCalc<span>UK</span></a><nav><a href="index.html#calculators">Calculators</a></nav></div></header><main class="container"><div class="tool"><p class="eyebrow">PROPERTY</p><h1>UK Mortgage Calculator</h1><div class="form-grid"><label>Mortgage amount (£)<input id="loan" type="number" value="250000" min="0"></label><label>Interest rate (%)<input id="rate" type="number" value="5" min="0" step=".01"></label><label>Term (years)<input id="years" type="number" value="25" min="1" max="50"></label></div><button class="calc" onclick="calcMortgage()">Calculate repayment</button><div id="result" class="result"></div><p style="color:#64748b;font-size:.9rem">Illustrative repayment estimate only. It does not include fees, insurance, taxes or lender-specific terms.</p></div></main><script src="calculator.js"></script><script>function calcMortgage(){const L=Math.max(0,Number(loan.value)||0),annual=Math.max(0,Number(rate.value)||0)/100,n=Math.max(1,Number(years.value)||1)*12,r=annual/12;let m=r?L*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):L/n,total=m*n;setResult('result',`Monthly repayment: <strong>${money(m)}</strong><br>Total repayments: <strong>${money(total)}</strong><br>Total interest: <strong>${money(total-L)}</strong>`)}</script></body></html>
