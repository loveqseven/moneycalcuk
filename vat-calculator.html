<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UK VAT Calculator | MoneyCalcUK</title><meta name="description" content="Free UK VAT calculator. Add or remove VAT from a price."><link rel="stylesheet" href="styles.css"><style>.tool{max-width:700px;margin:50px auto;background:#fff;border:1px solid #e4e9f1;border-radius:18px;padding:30px}label{font-weight:700}input,select{width:100%;padding:12px;margin-top:7px;border:1px solid #cbd5e1;border-radius:9px;font-size:1rem}.calc{margin-top:20px;background:#1769e0;color:#fff;border:0;padding:13px 20px;border-radius:9px;font-weight:800}.result{display:none;background:#f1f7ff;border-radius:14px;padding:20px;margin-top:20px}.result.show{display:block}</style></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html">MoneyCalc<span>UK</span></a><nav><a href="index.html#calculators">Calculators</a></nav></div></header><main class="container"><div class="tool"><p class="eyebrow">VAT</p><h1>UK VAT Calculator</h1><p style="color:#64748b">Default rate is 20%. Change the rate if needed.</p><label>Amount (£)<input id="amount" type="number" value="100" min="0" step=".01"></label><label style="display:block;margin-top:15px">VAT rate<select id="rate"><option value="20">20%</option><option value="5">5%</option><option value="0">0%</option></select></label><label style="display:block;margin-top:15px">Calculation<select id="mode"><option value="add">Add VAT to net price</option><option value="remove">Remove VAT from gross price</option></select></label><button class="calc" onclick="calcVAT()">Calculate VAT</button><div id="result" class="result"></div></div></main><script src="calculator.js"></script><script>function calcVAT(){const a=Math.max(0,Number(document.getElementById('amount').value)||0),r=Number(document.getElementById('rate').value)/100,mode=document.getElementById('mode').value;if(mode==='add'){const v=a*r;setResult('result',`Net price: <strong>${money(a)}</strong><br>VAT: <strong>${money(v)}</strong><br>Gross price: <strong>${money(a+v)}</strong>`)}else{const net=a/(1+r),v=a-net;setResult('result',`Net price: <strong>${money(net)}</strong><br>VAT included: <strong>${money(v)}</strong><br>Gross price: <strong>${money(a)}</strong>`)}}calcVAT()</script></body></html>
