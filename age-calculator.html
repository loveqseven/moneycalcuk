<!doctype html><html lang="en-GB"><head><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2310374741315855"
     crossorigin="anonymous"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Age Calculator | MoneyCalcUK</title><meta name="description" content="Calculate your age in years, months and days."><link rel="stylesheet" href="styles.css"><style>.tool{max-width:650px;margin:50px auto;background:#fff;border:1px solid #e4e9f1;border-radius:18px;padding:30px}input{padding:12px;border:1px solid #cbd5e1;border-radius:9px;width:100%;margin:8px 0 18px}.calc{background:#1769e0;color:#fff;border:0;padding:13px 20px;border-radius:9px;font-weight:800}.result{display:none;background:#f1f7ff;padding:20px;border-radius:14px;margin-top:20px}.result.show{display:block}</style></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html">MoneyCalc<span>UK</span></a><nav><a href="index.html#calculators">Calculators</a></nav></div></header><main class="container"><div class="tool"><p class="eyebrow">EVERYDAY</p><h1>Age Calculator</h1><label>Date of birth</label><input id="dob" type="date"><button class="calc" onclick="calcAge()">Calculate age</button><div id="result" class="result"></div></div></main><script>function calcAge(){const d=new Date(dob.value+'T00:00:00'),now=new Date();if(isNaN(d)){return}let y=now.getFullYear()-d.getFullYear(),m=now.getMonth()-d.getMonth(),day=now.getDate()-d.getDate();if(day<0){m--;day+=new Date(now.getFullYear(),now.getMonth(),0).getDate()}if(m<0){y--;m+=12}document.getElementById('result').innerHTML=`Age: <strong>${y} years, ${m} months and ${day} days</strong>`;document.getElementById('result').classList.add('show')}document.getElementById('dob').max=new Date().toISOString().split('T')[0]</script></body></html>
