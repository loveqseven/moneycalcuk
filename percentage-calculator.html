     crossorigin="anonymous"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Percentage Calculator | MoneyCalcUK</title><meta name="description" content="Free percentage calculator for common percentage calculations."><link rel="stylesheet" href="styles.css"><style>.tool{max-width:700px;margin:50px auto;background:#fff;border:1px solid #e4e9f1;border-radius:18px;padding:30px}label{font-weight:700;display:block;margin:15px 0}input{width:100%;padding:12px;margin-top:7px;border:1px solid #cbd5e1;border-radius:9px}.calc{background:#1769e0;color:#fff;border:0;padding:13px 20px;border-radius:9px;font-weight:800}.result{display:none;background:#f1f7ff;padding:20px;border-radius:14px;margin-top:20px}.result.show{display:block}</style></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html">MoneyCalc<span>UK</span></a><nav><a href="index.html#calculators">Calculators</a></nav></div></header><main class="container"><div class="tool"><p class="eyebrow">EVERYDAY</p><h1>Percentage Calculator</h1><label>What is <input id="pct" type="number" value="20"> % of <input id="num" type="number" value="200"></label><button class="calc" onclick="calcPct()">Calculate</button><div id="result" class="result"></div></div></main><script>function calcPct(){const p=Number(pct.value)||0,n=Number(num.value)||0;document.getElementById('result').innerHTML=`${p}% of ${n} = <strong>${(p*n/100).toLocaleString('en-GB')}</strong>`;document.getElementById('result').classList.add('show')}calcPct()</script></body></html>
