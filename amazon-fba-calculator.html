<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amazon FBA Calculator UK | MoneyCalcUK</title><meta name="description" content="Starter Amazon FBA profit calculator page for UK sellers."><link rel="stylesheet" href="styles.css"><style>.tool{max-width:700px;margin:50px auto;background:#fff;border:1px solid #e4e9f1;border-radius:18px;padding:30px}label{font-weight:700;display:block;margin:13px 0}input{width:100%;padding:12px;margin-top:6px;border:1px solid #cbd5e1;border-radius:9px}.calc{background:#1769e0;color:#fff;border:0;padding:13px 20px;border-radius:9px;font-weight:800}.result{display:none;background:#f1f7ff;padding:20px;border-radius:14px;margin-top:20px}.result.show{display:block}</style></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html">MoneyCalc<span>UK</span></a><nav><a href="index.html#calculators">Calculators</a></nav></div></header><main class="container"><div class="tool"><p class="eyebrow">AMAZON FBA</p><h1>Amazon FBA Profit Calculator UK</h1><label>Selling price (£)<input id="sell" type="number" value="30" min="0"></label><label>Product cost (£)<input id="cost" type="number" value="8" min="0"></label><label>Amazon referral fee (%)<input id="ref" type="number" value="15" min="0" step=".1"></label><label>FBA + fulfilment (£)<input id="fba" type="number" value="5" min="0" step=".01"></label><button class="calc" onclick="calcFBA()">Calculate</button><div id="result" class="result"></div><p style="color:#64748b;font-size:.9rem">Starter model only. Actual Amazon fees depend on category, fulfilment size/weight, storage, VAT and other charges.</p></div></main><script>function calcFBA(){const s=+sell.value||0,c=+cost.value||0,r=+ref.value||0,f=+fba.value||0,rf=s*r/100,p=s-c-rf-f;document.getElementById('result').innerHTML=`Referral fee: <strong>£${rf.toFixed(2)}</strong><br>Estimated profit before other costs: <strong>£${p.toFixed(2)}</strong><br>Margin: <strong>${s?(p/s*100).toFixed(2):'0.00'}%</strong>`;document.getElementById('result').classList.add('show')}</script></body></html>
